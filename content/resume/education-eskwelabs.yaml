title: Eskwelabs
subtitle: '*Data Science Bootcamp &nbsp; · &nbsp; July 2019 -- Oct 2019*'
body: Attended a 10-week bootcamp which included 160 hours of in-class learning in addition to coursework.
  At the end of the bootcamp, I presented my capstone project about modeling nonlinear chaotic systems
  using neural networks implemented in TensorFlow 1.x to industry leaders in Makati City, Philippines.
