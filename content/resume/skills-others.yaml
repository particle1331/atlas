title: Others
subtitle: ''
body: |-
  - Gold level in Problem Solving and Python @ [Hackerrank](https://www.hackerrank.com/particle)
  - Author of [OK Transformer](https://particle1331.github.io/ok-transformer/intro.html) — a collection of notebooks and articles on deep learning, ML engineering, and MLOps. Auto build / deploy via GitHub Actions + tox. Featured in the [Gallery of Jupyter Books](https://executablebooks.org/en/latest/gallery/).
  - Contributed to the [Appendix: Mathematics for Deep Learning](https://www.d2l.ai/chapter_appendix-mathematics-for-deep-learning/index.html) of [Dive into Deep Learning](https://www.d2l.ai/) — a widely used open-source DL textbook; acknowledged as a [contributor](https://www.d2l.ai/chapter_preface/index.html#acknowledgments).
