[project]
name = "atlas"
version = "0.1.0"
description = "Helping to manage the crushing weight of AI slop."
readme = "README.md"
authors = [
    { name = "particle1331", email = "particle1331@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "flet[all]>=1.0.5",
    "ipykernel>=7.3.0",
    "nbclient>=0.11.0",
    "nbformat>=5.10.0",
    "markdown-it-py>=4.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pillow>=11.0",
    "pdfminer.six>=20250506",
    "pygments>=2.0",
    "pypdf>=5.0",
    "typer>=0.15",
    "picoagents>=0.5.0",
    "pandas>=3.1.1",
]

[project.scripts]
at = "atlas.cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.isort]
profile = "black"
extend_skip_glob = ["projects/*"]

[tool.black]
extend-exclude = "/projects/"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["projects", ".*", "build", "dist", "venv", "{arch}"]
